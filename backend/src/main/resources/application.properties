# ============================================================
# Server
# ============================================================
server.port=${SERVER_PORT:8080}

# ============================================================
# DataSource — override with environment variables in production
# ============================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/amazon_products}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are sensible; tune if needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# Flyway — runs V1/V2 migrations automatically on startup
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# Jackson
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ============================================================
# Business configuration
# ============================================================
# Hours before a cached product is considered stale and needs re-scraping
app.product.cache-ttl-hours=${PRODUCT_CACHE_TTL_HOURS:6}

# Supported Amazon marketplace domain (SSRF protection)
app.amazon.allowed-domain=${AMAZON_MARKETPLACE:amazon.in}

# Maximum scrape job retry attempts (worker reads this too via DB)
app.scrape.max-retries=${SCRAPE_MAX_RETRIES:3}
